<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgE1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgE1)" />

  <!-- Jupyter / Notebook Header Bar -->
  <rect width="1200" height="56" fill="#141414" stroke="#222" stroke-width="1" />
  <circle cx="28" cy="28" r="6" fill="#ff5f56" />
  <circle cx="48" cy="28" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="28" r="6" fill="#27c93f" />
  <text x="100" y="33" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#F7F7F7">tetouan_energy_eda_forecasting.ipynb</text>
  <rect x="980" y="14" width="190" height="28" rx="6" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1" />
  <text x="1075" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFB22C" text-anchor="middle">PYTHON 3.10 KERNEL</text>

  <!-- Left Sidebar / Dataset Info -->
  <rect x="0" y="56" width="300" height="694" fill="#111" stroke="#222" stroke-width="1" />
  <g transform="translate(24, 80)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#F7F7F7">UCI Tetouan Dataset</text>
    <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFB22C">52,417 Observations</text>
    
    <rect y="60" width="252" height="1" fill="#252525" />

    <text x="0" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#888">METRIC CHARACTERISTICS</text>
    <text x="0" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A0A0A0">• 10-Minute Reading Intervals</text>
    <text x="0" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A0A0A0">• 3 Power Distribution Zones</text>
    <text x="0" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A0A0A0">• Full Year Temporal Scope</text>

    <text x="0" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#888">WEATHER VARIABLES</text>
    <text x="0" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A0A0A0">• Temperature (°C)</text>
    <text x="0" y="244" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A0A0A0">• Relative Humidity (%)</text>
    <text x="0" y="266" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A0A0A0">• Wind Speed (m/s)</text>
    <text x="0" y="288" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A0A0A0">• General Diffuse Flows</text>
    <text x="0" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A0A0A0">• Diffuse Solar Flows</text>

    <rect y="340" width="252" height="70" rx="8" fill="#181818" stroke="#333" />
    <text x="14" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFB22C">STATUS: In Development</text>
    <text x="14" y="388" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#888">Exploratory phase &amp; feature creation</text>
  </g>

  <!-- Main Analysis View -->
  <g transform="translate(330, 80)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#F7F7F7">Multi-Zone Electricity Consumption Distribution</text>
    <text x="0" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#A0A0A0">Diurnal power demand curves across Zone 1, Zone 2, and Zone 3 during seasonal shifts.</text>

    <!-- Chart Panel -->
    <rect x="0" y="80" width="820" height="550" rx="12" fill="#141414" stroke="#262626" />
    <text x="24" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#F7F7F7">Power Demand Profiles (24-Hour Average Cycle)</text>

    <!-- Legend -->
    <rect x="520" y="100" width="12" height="12" rx="2" fill="#FFB22C" />
    <text x="540" y="111" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#bbb">Zone 1 (Commercial)</text>

    <rect x="680" y="100" width="12" height="12" rx="2" fill="#854836" />
    <text x="700" y="111" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#bbb">Zone 2 (Residential)</text>

    <!-- Chart area -->
    <g transform="translate(50, 150)">
      <line x1="20" y1="380" x2="720" y2="380" stroke="#333" stroke-width="1.5" />
      <line x1="20" y1="380" x2="20" y2="20" stroke="#333" stroke-width="1.5" />
      
      <!-- Horizontal grid -->
      <line x1="20" y1="290" x2="720" y2="290" stroke="#222" stroke-dasharray="4 4" />
      <line x1="20" y1="200" x2="720" y2="200" stroke="#222" stroke-dasharray="4 4" />
      <line x1="20" y1="110" x2="720" y2="110" stroke="#222" stroke-dasharray="4 4" />

      <text x="10" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#666" transform="rotate(-90 10 200)" text-anchor="middle">Power (kW)</text>
      <text x="370" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#777" text-anchor="middle">Time of Day (00:00 to 23:00)</text>

      <!-- Curve 1: Zone 1 (Amber) -->
      <path d="M 20 320 C 120 340 220 280 320 140 C 420 120 520 160 620 130 C 670 180 720 260 720 260" fill="none" stroke="#FFB22C" stroke-width="3.5" />

      <!-- Curve 2: Zone 2 (Brown/Orange) -->
      <path d="M 20 350 C 120 360 220 340 320 240 C 420 230 520 200 620 170 C 670 210 720 290 720 290" fill="none" stroke="#854836" stroke-width="3" stroke-dasharray="6 3" />

      <!-- Peak Annotations -->
      <circle cx="320" cy="140" r="5" fill="#FFB22C" />
      <text x="320" y="115" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFB22C" text-anchor="middle">Midday Peak</text>

      <circle cx="620" cy="130" r="5" fill="#FFB22C" />
      <text x="620" y="105" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFB22C" text-anchor="middle">Evening Peak</text>
    </g>
  </g>
</svg>

